<text font-size="17.77px" xml:space="preserve">
<tspan x="429.7" y="43.8" fill="#cd8c07">OS:            </tspan>
<tspan x="589.6" y="43.8" fill="#f2e6c8">Espanol x86_64, Scotland build</tspan>
<tspan x="429.7" y="66.3" fill="#cd8c07">Host:          </tspan>
<tspan x="589.6" y="66.3" fill="#f2e6c8">Apple Retail (10y: sales, support, lead)</tspan>
<tspan x="429.7" y="88.9" fill="#cd8c07">Kernel:        </tspan>
<tspan x="589.6" y="88.9" fill="#f2e6c8">self-taught-2.0-agents</tspan>
<tspan x="429.7" y="111.4" fill="#cd8c07">Uptime:        </tspan>
<tspan x="589.6" y="111.4" fill="#f2e6c8">2 years, still compiling</tspan>
<tspan x="429.7" y="134.0" fill="#cd8c07">Packages:      </tspan>
<tspan x="589.6" y="134.0" fill="#f2e6c8">9 repos, zero bloat</tspan>
<tspan x="429.7" y="156.6" fill="#cd8c07">Shell:         </tspan>
<tspan x="589.6" y="156.6" fill="#f2e6c8">bash, but I live in llama.cpp</tspan>
<tspan x="429.7" y="179.1" fill="#cd8c07">Resolution:    </tspan>
<tspan x="589.6" y="179.1" fill="#f2e6c8">2 years, no going back</tspan>
<tspan x="429.7" y="201.7" fill="#cd8c07">WM:            </tspan>
<tspan x="589.6" y="201.7" fill="#f2e6c8">Hyprland, via Omarchy</tspan>
<tspan x="429.7" y="224.2" fill="#cd8c07">WM Theme:      </tspan>
<tspan x="589.6" y="224.2" fill="#f2e6c8">No Skin Selectors</tspan>
<tspan x="429.7" y="246.8" fill="#cd8c07">Theme:         </tspan>
<tspan x="589.6" y="246.8" fill="#f2e6c8">Open Source Must Win [dark]</tspan>
<tspan x="429.7" y="269.3" fill="#cd8c07">Icons:         </tspan>
<tspan x="589.6" y="269.3" fill="#f2e6c8">hand-drawn calavera, no bones-and-ash</tspan>
<tspan x="429.7" y="291.9" fill="#cd8c07">Terminal:      </tspan>
<tspan x="589.6" y="291.9" fill="#f2e6c8">Ghostty, Omarchy default</tspan>
<tspan x="429.7" y="314.5" fill="#cd8c07">Terminal Font: </tspan>
<tspan x="589.6" y="314.5" fill="#f2e6c8">whatever shipped, never touched it</tspan>
<tspan x="429.7" y="337.0" fill="#cd8c07">CPU:           </tspan>
<tspan x="589.6" y="337.0" fill="#f2e6c8">irrelevant, ask the GPU</tspan>
<tspan x="429.7" y="359.6" fill="#f0b030">GPU:           </tspan>
<tspan x="589.6" y="359.6" fill="#f2e6c8">RTX 5090, the whole point</tspan>
<tspan x="429.7" y="382.1" fill="#cd8c07">Memory:        </tspan>
<tspan x="589.6" y="382.1" fill="#f2e6c8">Qwen3-27B, Q6 quantized (lossy, like memory)</tspan>
</text>

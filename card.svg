<tspan x="657.8" y="212.2" fill="#cd8c07">OS:            </tspan>
<tspan x="774.8" y="212.2" fill="#f2e6c8">Espanol x86_64, Scotland build</tspan>
<tspan x="657.8" y="228.8" fill="#cd8c07">Host:          </tspan>
<tspan x="774.8" y="228.8" fill="#f2e6c8">Apple Retail (10y: sales, support, lead)</tspan>
<tspan x="657.8" y="245.2" fill="#cd8c07">Kernel:        </tspan>
<tspan x="774.8" y="245.2" fill="#f2e6c8">self-taught-2.0-agents</tspan>
<tspan x="657.8" y="261.8" fill="#cd8c07">Uptime:        </tspan>
<tspan x="774.8" y="261.8" fill="#f2e6c8">2 years, still compiling</tspan>
<tspan x="657.8" y="278.2" fill="#cd8c07">Packages:      </tspan>
<tspan x="774.8" y="278.2" fill="#f2e6c8">9 repos, zero bloat</tspan>
<tspan x="657.8" y="294.8" fill="#cd8c07">Shell:         </tspan>
<tspan x="774.8" y="294.8" fill="#f2e6c8">bash, but I live in llama.cpp</tspan>
<tspan x="657.8" y="311.2" fill="#cd8c07">Resolution:    </tspan>
<tspan x="774.8" y="311.2" fill="#f2e6c8">2 years, no going back</tspan>
<tspan x="657.8" y="327.8" fill="#cd8c07">WM:            </tspan>
<tspan x="774.8" y="327.8" fill="#f2e6c8">Hyprland, via Omarchy</tspan>
<tspan x="657.8" y="344.2" fill="#cd8c07">WM Theme:      </tspan>
<tspan x="774.8" y="344.2" fill="#f2e6c8">No Skin Selectors</tspan>
<tspan x="657.8" y="360.8" fill="#cd8c07">Theme:         </tspan>
<tspan x="774.8" y="360.8" fill="#f2e6c8">Open Source Must Win [dark]</tspan>
<tspan x="657.8" y="377.2" fill="#cd8c07">Icons:         </tspan>
<tspan x="774.8" y="377.2" fill="#f2e6c8">hand-drawn calavera, no bones-and-ash</tspan>
<tspan x="657.8" y="393.8" fill="#cd8c07">Terminal:      </tspan>
<tspan x="774.8" y="393.8" fill="#f2e6c8">Ghostty, Omarchy default</tspan>
<tspan x="657.8" y="410.2" fill="#cd8c07">Terminal Font: </tspan>
<tspan x="774.8" y="410.2" fill="#f2e6c8">whatever shipped, never touched it</tspan>
<tspan x="657.8" y="426.8" fill="#cd8c07">CPU:           </tspan>
<tspan x="774.8" y="426.8" fill="#f2e6c8">irrelevant, ask the GPU</tspan>
